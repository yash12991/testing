[project]
name = "orchestrator"
version = "0.1.0"
description = "Auto-remediation orchestrator for the BTP chaos-engineering pipeline"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "kubernetes>=29.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]
