apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-role
  namespace: online-boutique
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # The `scale_replicas` fix action calls
  # apps_v1.patch_namespaced_deployment_scale, which operates on the
  # deployments/scale *subresource* — granting "patch" on "deployments"
  # above does not implicitly cover it; Kubernetes RBAC requires
  # subresources to be listed explicitly. Discovered live in Task 16: a
  # real cpu_stress incident reached fix_executed but the Fixer got back
  # "(403) deployments/scale is forbidden" and the incident was correctly
  # (but unhelpfully) reported as recovered=false.
  #
  # "patch" only (no "get"): fixer.py's scale_replicas calls
  # patch_namespaced_deployment_scale and nothing else — it never reads
  # the scale subresource — so granting "get" here would be an unused
  # permission.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch"]
