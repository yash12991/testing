# pod-crash.yaml
#
# Second-review "pod_crash" scenario: kills the cartservice container
# in place. Originally written with Chaos Mesh's `pod-kill` action (which
# deletes the whole Pod object), but live verification (see
# task-15-report.md) proved that approach can never trip the Observer's
# `pod_crash` threshold: `error_rate` is structurally dead cluster-wide (no
# `http_requests_total` metric exists for any Online Boutique service), so
# `restart_count_delta > 0` is the only leg of the threshold that can ever
# fire — and `pod-kill` replaces the whole Pod object rather than restarting
# a container in place, so `kube_pod_container_status_restarts_total`
# (which only counts in-place restarts within the SAME pod) never
# increments for it; confirmed live via
# `increase(kube_pod_container_status_restarts_total{pod=~"cartservice.*"}[300s])`
# staying at 0 after a `pod-kill` run.
#
# Switched to `container-kill`, which sends SIGKILL to the container
# process within the same pod, causing an in-place kubelet restart — the
# same mechanism that incremented the restart counter in the
# memory-pressure test. cartservice has a single container (`server`,
# confirmed via `kubectl get pods -l app=cartservice -o
# jsonpath='{.items[0].spec.containers[*].name}'`). Unlike `pod-kill`,
# `container-kill`'s admission webhook (`vpodchaos.kb.io`) requires
# `spec.containerNames` to be explicitly set (confirmed live: applying
# without it is rejected with "Spec.containerNames: Invalid value: null:
# the name of container is required on container-kill action"), so
# `containerNames: ["server"]` is set below. Re-verified live against the
# cluster: see task-15-report.md's "Fix" section — the restart counter
# genuinely increments now.
#
# No `duration` is set: both `pod-kill` and `container-kill` are one-shot
# actions (duration is only required for `pod-failure`), so Chaos Mesh kills
# the selected container once and immediately reports the experiment
# Finished.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-crash-cartservice
  namespace: online-boutique
spec:
  action: container-kill
  mode: one
  containerNames:
    - server
  selector:
    namespaces:
      - online-boutique
    labelSelectors:
      app: cartservice
